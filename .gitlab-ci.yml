workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(dev|staging|prod)-[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - when: never

stages:
  - validate
  - release_guard
  - registry
  - deploy
  - verify

variables:
  RELEASE_BRANCH: main
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: /certs
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"

test:
  stage: validate
  image: node:22-alpine
  tags: [homelab-rootless]
  script:
    - npm test

release_branch_guard:
  stage: release_guard
  image: alpine:3.20
  tags: [homelab-rootless]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(dev|staging|prod)-[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$/'
    - when: never
  script:
    - apk add --no-cache git
    - test -n "$RELEASE_BRANCH"
    - git fetch --no-tags origin "$RELEASE_BRANCH"
    - git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/$RELEASE_BRANCH"

build_image:
  stage: registry
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind-rootless
      alias: docker
  tags: [homelab-rootless]
  needs:
    - job: test
    - job: release_branch_guard
      optional: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(dev|staging|prod)-[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$/'
    - when: never
  script:
    - docker info
    - export IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker build --pull --platform linux/amd64 -t "$IMAGE" .
    - docker run --rm "$IMAGE" wget -qO- http://127.0.0.1/healthz >/dev/null
    - docker push "$IMAGE"
    - export IMAGE_DIGEST="$(docker image inspect --format='{{index .RepoDigests 0}}' "$IMAGE")"
    - test "$IMAGE_DIGEST" = "$CI_REGISTRY_IMAGE@${IMAGE_DIGEST##*@}"
    - printf 'IMAGE_DIGEST=%s\n' "$IMAGE_DIGEST" > release.env
  artifacts:
    reports:
      dotenv: release.env
    expire_in: 30 days
  after_script:
    - docker logout "$CI_REGISTRY" >/dev/null 2>&1 || true

deploy_prod:
  stage: deploy
  image: alpine:3.20
  tags: [homelab-rootless]
  when: manual
  allow_failure: false
  environment:
    name: production
    url: https://k8s-syntax.dungxbuif.com
  needs:
    - job: build_image
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^prod-[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$/'
    - when: never
  script:
    - apk add --no-cache openssh-client
    - test -n "$K8S_SYNTAX_SWARM_MANAGER_HOST"
    - test -n "$K8S_SYNTAX_SWARM_MANAGER_USER"
    - test -n "$K8S_SYNTAX_SWARM_SSH_PRIVATE_KEY"
    - test -n "$K8S_SYNTAX_SWARM_KNOWN_HOSTS"
    - install -m 0600 /dev/null deploy-key
    - printf '%s\n' "$K8S_SYNTAX_SWARM_SSH_PRIVATE_KEY" > deploy-key
    - install -m 0644 /dev/null known-hosts
    - printf '%s\n' "$K8S_SYNTAX_SWARM_KNOWN_HOSTS" > known-hosts
    - export SSH_OPTS="-i $CI_PROJECT_DIR/deploy-key -o UserKnownHostsFile=$CI_PROJECT_DIR/known-hosts -o StrictHostKeyChecking=yes -o ConnectTimeout=10"
    - export TARGET="$K8S_SYNTAX_SWARM_MANAGER_USER@$K8S_SYNTAX_SWARM_MANAGER_HOST"
    - printf '%s' "$CI_REGISTRY_PASSWORD" | ssh $SSH_OPTS "$TARGET" "docker login '$CI_REGISTRY' --username '$CI_REGISTRY_USER' --password-stdin"
    - ssh $SSH_OPTS "$TARGET" "docker service inspect k8s-syntax >/dev/null"
    - ssh $SSH_OPTS "$TARGET" "docker service update --with-registry-auth --image '$IMAGE_DIGEST' --update-parallelism 1 --update-order stop-first --update-failure-action rollback --rollback-failure-action pause --detach=false k8s-syntax"
    - ssh $SSH_OPTS "$TARGET" "docker logout '$CI_REGISTRY' >/dev/null 2>&1 || true"

verify_prod:
  stage: verify
  image: curlimages/curl:8.11.1
  tags: [homelab-rootless]
  needs: [deploy_prod]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^prod-[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$/'
    - when: never
  script:
    - curl --fail --silent --show-error --retry 10 --retry-delay 3 https://k8s-syntax.dungxbuif.com/healthz
