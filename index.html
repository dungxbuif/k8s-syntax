<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K8s Syntax</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">K8S / KUBECTL</p>
        <h1>K8s Syntax</h1>
      </div>
      <div class="top-actions">
        <span id="session-status" class="status-pill">Chưa bắt đầu</span>
        <button id="start-session" class="button primary">Bắt đầu buổi</button>
        <button id="end-session" class="button">Kết thúc & báo cáo</button>
      </div>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <nav id="nav">
          <button class="nav-item active" data-view="dashboard">Dashboard</button>
          <button class="nav-item" data-view="drill">Luyện bài</button>
          <button class="nav-item" data-view="quick-config">Quick config</button>
          <button class="nav-item" data-view="mistakes">Mistakes & actions</button>
          <button class="nav-item" data-view="sources">Nguồn học</button>
        </nav>
        <div class="sidebar-note">
          <strong>Nguyên tắc</strong>
          <p>Nhìn → che → tự gõ → submit → ghi lỗi → lặp lại.</p>
        </div>
      </aside>
      <main id="screen" class="content" aria-live="polite"></main>
    </div>
  </div>
  <script type="module" src="src/app.mjs?v=e5e2a60"></script>
</body>
</html>
